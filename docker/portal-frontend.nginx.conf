# nginx only inherits a parent block's add_header directives into a location that defines
# none of its own — so the header set is centralized here via a map and repeated verbatim in
# every location below, rather than relying on inheritance (which /index.html's extra
# Cache-Control header would otherwise silently break).
map $host $csp_header {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:8081; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; manifest-src 'self'; frame-ancestors 'none';";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same header set the production Vite build emits via its `_headers` artifact (see
    # portal/frontend/src/security/contentSecurityPolicy.ts) — CSP's connect-src is pinned to
    # this demo stack's fixed VITE_API_BASE_URL (http://localhost:8081).
    add_header Content-Security-Policy $csp_header always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location = /index.html {
        add_header Content-Security-Policy $csp_header always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cache-Control "no-cache" always;
    }

    # Client-side routing (react-router) — fall back to index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
