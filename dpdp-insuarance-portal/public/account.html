<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — Life Insurance Provider</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #1e3a5f;
    --primary-dark: #132540;
    --primary-light: #e8f0fc;
    --accent: #c8963a;
    --accent-light: #fdf3e3;
    --success: #2e7d32;
    --success-light: #e8f5e9;
    --warning: #b45309;
    --warning-light: #fef9c3;
    --danger: #c62828;
    --danger-light: #fbe9e7;
    --bg: #f5f7fa;
    --card: #ffffff;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }

  /* ── Header ── */
  header {
    background: var(--primary); padding: 0 48px; height: 64px;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 2px 8px rgba(0,0,0,.2); position: sticky; top: 0; z-index: 200;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand-logo { width: 36px; height: 36px; border-radius: 8px; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .brand-name { font-size: 16px; font-weight: 700; color: #fff; }
  .brand-tagline { font-size: 11px; color: rgba(255,255,255,.6); margin-top: 1px; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .user-pill {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,.1); border-radius: 10px; padding: 7px 14px;
  }
  .user-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0; }
  .user-email { font-size: 13px; color: rgba(255,255,255,.9); font-weight: 500; }
  .btn-header {
    font-size: 12px; color: rgba(255,255,255,.7); text-decoration: none;
    padding: 7px 14px; border: 1px solid rgba(255,255,255,.2);
    border-radius: 7px; cursor: pointer; background: transparent; transition: all .2s;
  }
  .btn-header:hover { color: #fff; border-color: rgba(255,255,255,.5); background: rgba(255,255,255,.08); }
  .btn-portal {
    font-size: 12px; font-weight: 700; color: var(--accent);
    padding: 7px 14px; border: 1px solid rgba(200,150,58,.4);
    border-radius: 7px; cursor: pointer; background: rgba(200,150,58,.08);
    text-decoration: none; transition: all .2s;
  }
  .btn-portal:hover { background: rgba(200,150,58,.18); border-color: var(--accent); }

  /* ── Split layout ── */
  .split-container { display: flex; flex: 1; overflow: hidden; min-height: 0; }
  .main-pane { width: 62%; min-width: 320px; overflow-y: auto; flex-shrink: 0; }
  .split-handle { width: 5px; background: var(--border); cursor: col-resize; flex-shrink: 0; transition: background .15s; }
  .split-handle:hover, .split-handle.dragging { background: var(--accent); }
  .api-pane { flex: 1; min-width: 260px; display: flex; flex-direction: column; background: #0f1923; overflow: hidden; }
  .api-pane-header { padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; background: #080f18; }
  .api-pane-title { font-size: 12px; font-weight: 700; color: #94a3b8; display: flex; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: .5px; }
  .api-pane-body { flex: 1; overflow-y: auto; padding: 10px; }
  .api-drawer-empty { color: #4a5568; font-size: 12px; text-align: center; padding: 32px 16px; line-height: 1.6; }
  .api-badge { background: var(--accent); color: #fff; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 10px; min-width: 18px; text-align: center; }
  .api-clear-btn { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); color: #94a3b8; font-size: 11px; font-weight: 600; border-radius: 6px; padding: 4px 10px; cursor: pointer; transition: all .2s; }
  .api-clear-btn:hover { background: rgba(255,255,255,.14); color: #e2e8f0; }
  .api-entry { margin-bottom: 16px; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,.12); }
  .api-entry-head { padding: 10px 14px; background: rgba(255,255,255,.04); display: flex; align-items: center; gap: 10px; }
  .api-method { font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 5px; font-family: monospace; flex-shrink: 0; }
  .m-get { background: #1a4731; color: #4ade80; }
  .api-url { font-size: 11px; color: #94a3b8; font-family: monospace; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .api-status { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 5px; flex-shrink: 0; }
  .s-ok  { background: #1a4731; color: #4ade80; }
  .s-err { background: #3b0f0f; color: #f87171; }
  .api-entry-body { padding: 12px 14px; background: #0a1018; border-top: 1px solid rgba(255,255,255,.04); }
  .api-block-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: #e2e8f0; margin-bottom: 6px; margin-top: 14px; }
  .api-block-label:first-child { margin-top: 0; }
  .api-block-label:not(:first-child) { border-top: 1px solid rgba(255,255,255,.12); padding-top: 10px; }
  .api-search-filters { background: #0d1f1a; border-radius: 6px; padding: 8px 12px; border: 1px solid rgba(74,222,128,.2); margin-bottom: 4px; }
  .filter-row { display: flex; gap: 10px; align-items: baseline; font-size: 11px; font-family: 'Courier New', monospace; padding: 2px 0; }
  .filter-key { color: #4ade80; font-weight: 700; min-width: 110px; flex-shrink: 0; }
  .filter-val { color: #e2e8f0; word-break: break-all; }
  .api-code { background: #060d14; border-radius: 6px; padding: 10px 12px; font-family: 'Courier New', monospace; font-size: 12px; color: #a0c4ff; white-space: pre-wrap; word-break: break-all; border: 1px solid rgba(255,255,255,.04); }
  .json-key  { color: #9cdcfe; }
  .json-str  { color: #ce9178; }
  .json-num  { color: #b5cea8; }
  .json-bool { color: #569cd6; }
  .json-null { color: #808080; }
  .api-chevron { font-size: 9px; color: #64748b; flex-shrink: 0; margin-left: auto; padding-left: 6px; }
  .api-entry-head:hover { background: rgba(255,255,255,.07); }

  /* ── Main content ── */
  main { max-width: 720px; width: 100%; margin: 0 auto; padding: 36px 24px 60px; }

  .section-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.05); margin-bottom: 24px; }
  .section-card-header { padding: 18px 24px; background: #f8fafc; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .section-card-header h2 { font-size: 15px; font-weight: 700; color: var(--text); }
  .section-card-header p { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .section-icon { font-size: 20px; margin-right: 8px; }
  .section-card-body { padding: 24px; }

  .loading-row { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; padding: 20px 0; }
  .spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--primary); animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Quotation status states */
  .quotation-active {
    display: flex; align-items: flex-start; gap: 16px;
    background: linear-gradient(135deg, #e8f5e9, #f1f8e9);
    border: 1px solid #a5d6a7; border-radius: 12px; padding: 20px 24px;
  }
  .quotation-active-icon { font-size: 32px; flex-shrink: 0; }
  .quotation-active h3 { font-size: 16px; font-weight: 700; color: var(--success); margin-bottom: 4px; }
  .quotation-active p { font-size: 13px; color: #3d7540; line-height: 1.6; }

  .quotation-none {
    background: var(--warning-light); border: 1px solid #fde68a;
    border-radius: 12px; padding: 20px 24px;
    display: flex; align-items: flex-start; gap: 16px;
  }
  .quotation-none-icon { font-size: 28px; flex-shrink: 0; }
  .quotation-none h3 { font-size: 15px; font-weight: 700; color: var(--warning); margin-bottom: 4px; }
  .quotation-none p { font-size: 13px; color: #92400e; line-height: 1.55; }

  .quotation-error {
    background: var(--danger-light); border: 1px solid #ef9a9a;
    border-radius: 12px; padding: 16px 20px; font-size: 13px; color: var(--danger);
  }

  .steps { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .step-pill { display: flex; align-items: center; gap: 6px; font-size: 12px; background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; color: var(--muted); }
  .step-pill.active { border-color: var(--success); color: var(--success); font-weight: 600; }
  .step-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

  .meta-row { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .meta-row:last-child { border-bottom: none; }
  .meta-key { color: var(--muted); }
  .meta-val { font-weight: 600; font-family: 'Courier New', monospace; font-size: 12px; color: var(--text); word-break: break-all; text-align: right; max-width: 60%; }
  .meta-val.normal { font-family: inherit; font-size: 13px; }

  .status-badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; padding: 2px 8px; border-radius: 8px; }
  .badge-active  { background: var(--success-light); color: var(--success); }
  .badge-revoked { background: #f1f5f9; color: #94a3b8; }
  .badge-expired { background: var(--warning-light); color: var(--warning); }

  .btn-get-quote { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; background: var(--accent); color: #fff; padding: 11px 24px; border-radius: 8px; font-size: 13px; font-weight: 700; text-decoration: none; transition: background .2s; }
  .btn-get-quote:hover { background: #b5842e; }

  .btn-refresh { font-size: 12px; color: var(--primary); font-weight: 600; background: var(--primary-light); border: none; border-radius: 7px; padding: 7px 14px; cursor: pointer; transition: background .2s; display: flex; align-items: center; gap: 6px; }
  .btn-refresh:hover { background: #d0e4f8; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-logo">🛡️</div>
    <div>
      <div class="brand-name" id="company-name">Insurance Corporation</div>
      <div class="brand-tagline">My Account</div>
    </div>
  </div>
  <div class="header-right">
    <div class="user-pill">
      <div class="user-avatar" id="user-avatar">U</div>
      <span class="user-email" id="user-email">user@example.com</span>
    </div>
    <a id="portal-btn" href="http://localhost:5173/customer/consents" target="_blank" class="btn-portal">One-Stop Portal ↗</a>
    <button class="btn-header" onclick="doLogout()">Log out</button>
  </div>
</header>

<div class="split-container">
<div class="main-pane" id="main-pane">
<main>

  <!-- Quotation Status -->
  <div class="section-card">
    <div class="section-card-header">
      <div>
        <h2><span class="section-icon">📋</span>My Quotation</h2>
        <p>Checking Consent Manager for an active insurance quotation consent</p>
      </div>
      <button class="btn-refresh" onclick="loadQuotation(true)">↻ Refresh</button>
    </div>
    <div class="section-card-body" id="quotation-body">
      <div class="loading-row"><div class="spinner"></div> Checking for active consent…</div>
    </div>
  </div>

</main>
</div>
<div class="split-handle" id="split-handle"></div>
<div class="api-pane">
  <div class="api-pane-header">
    <div class="api-pane-title">📡 REST API Calls <span class="api-badge" id="api-count">0</span></div>
    <button class="api-clear-btn" onclick="doClearApiLogs()">Clear</button>
  </div>
  <div class="api-pane-body" id="api-drawer-body">
    <div class="api-drawer-empty">Consent check API call will appear here.</div>
  </div>
</div>
</div>

<script>
  var userEmail = '';
  var userName  = '';
  var consentPortalBase = 'http://localhost:5173';

  async function init() {
    var me;
    try {
      var meResp = await fetch('/api/me');
      if (meResp.status === 401) { window.location.href = '/auth/login'; return; }
      me = await meResp.json();
    } catch (e) {
      window.location.href = '/auth/login';
      return;
    }
    userEmail = me.email || '';
    userName  = me.name  || '';

    document.getElementById('user-email').textContent = userEmail;
    document.getElementById('user-avatar').textContent = (userName || userEmail)[0].toUpperCase();

    fetch('/api/config').then(function(r) { return r.json(); }).then(function(cfg) {
      var name = cfg.companyName || 'Insurance Corporation';
      document.getElementById('company-name').textContent = name;
      document.title = 'My Account — ' + name;
      if (cfg.consentPortalUrl) consentPortalBase = cfg.consentPortalUrl;
      document.getElementById('portal-btn').href =
        consentPortalBase + '/customer/consents?auto_login=' + encodeURIComponent(userEmail);
    }).catch(function() {});

    await clearApiLogs();
    loadQuotation(false);
  }

  function doLogout() {
    window.location.href = '/auth/logout';
  }

  async function loadQuotation(clearFirst) {
    if (clearFirst) await clearApiLogs();
    var body = document.getElementById('quotation-body');
    body.innerHTML = '<div class="loading-row"><div class="spinner"></div> Checking for active consent…</div>';

    try {
      var r = await fetch('/api/user-consents?purposeName=create_custom_insurance_policy');
      var data = await r.json();
      await refreshApiLogs();

      if (!r.ok) { renderError(data.error || 'Failed to load.'); return; }

      var list = data.data || data || [];

      // Exclude consents where the logged-in user is only a delegate (guardian).
      // Guardians can see those in the One-Stop Portal, not here.
      var myConsents = list.filter(function(c) {
        var auths = c.authorizations || [];
        if (!auths.length) return true; // no auth info — show it
        var myAuth = auths.find(function(a) {
          return (a.userId || '').toLowerCase() === userEmail.toLowerCase();
        });
        if (!myAuth) return false; // user not in this consent's auth list
        return myAuth.type !== 'delegate'; // skip if user's role is guardian only
      });

      var activeConsent   = myConsents.find(function(c) { return (c.currentStatus || c.status || '').toUpperCase() === 'ACTIVE'; });
      var createdConsent  = myConsents.find(function(c) { return (c.currentStatus || c.status || '').toUpperCase() === 'CREATED'; });
      var inactiveConsent = myConsents.find(function(c) {
        var s = (c.currentStatus || c.status || '').toUpperCase();
        return s === 'REVOKED' || s === 'EXPIRED';
      });

      if (!myConsents.length && list.length > 0) {
        // Consents exist but none belong to this user (all are guardian-only) → treat as none
        renderNone();
      } else if (activeConsent) {
        renderActive(activeConsent);
      } else if (createdConsent) {
        // Check if this is a delegated consent for a minor
        var auths = createdConsent.authorizations || [];
        var isDelegateSubject = auths.some(function(a) {
          return a.type === 'delegate_subject' && (a.userId || '').toLowerCase() === userEmail.toLowerCase();
        });
        if (isDelegateSubject) {
          var guardianAuth = auths.find(function(a) { return a.type === 'delegate'; });
          renderGuardianPending(createdConsent, guardianAuth ? guardianAuth.userId : null);
        } else {
          renderActive(createdConsent); // adult CREATED — show under-review state
        }
      } else if (inactiveConsent) {
        renderInactive(inactiveConsent);
      } else {
        renderNone();
      }
    } catch (e) {
      renderError('Could not connect: ' + e.message);
    }
  }

  function renderActive(c) {
    var status = (c.currentStatus || c.status || 'ACTIVE').toUpperCase();
    var expiry = c.validityTime ? 'Expires ' + formatTs(c.validityTime) : 'No expiry';
    var shortId = c.id ? c.id.substring(0, 8) + '…' : 'N/A';

    document.getElementById('quotation-body').innerHTML =
      '<div class="quotation-active">' +
        '<div class="quotation-active-icon">⏳</div>' +
        '<div style="flex:1;">' +
          '<h3>Quotation Under Review</h3>' +
          '<p>We have received your application and are preparing your personalised insurance plan. You will receive your quote by email within 1 business day.</p>' +
          '<div class="steps">' +
            '<div class="step-pill active"><span class="step-dot"></span> Application received</div>' +
            '<div class="step-pill"><span class="step-dot"></span> Quote in preparation</div>' +
            '<div class="step-pill"><span class="step-dot"></span> Quote sent to you</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div style="margin-top:16px;">' +
        '<div class="meta-row"><span class="meta-key">Consent ID</span><span class="meta-val">' + escHtml(c.id || 'N/A') + '</span></div>' +
        '<div class="meta-row"><span class="meta-key">Status</span><span class="meta-val normal"><span class="status-badge badge-active">' + status + '</span></span></div>' +
        '<div class="meta-row"><span class="meta-key">Validity</span><span class="meta-val normal">' + escHtml(expiry) + '</span></div>' +
      '</div>' +
      '<p style="margin-top:16px; font-size:12px; color:var(--muted);">To manage or revoke your consent, visit the <a id="manage-link" href="' + escHtml(consentPortalBase + '/customer/consents?auto_login=' + encodeURIComponent(userEmail)) + '" target="_blank" style="color:var(--primary); font-weight:600;">One-Stop Consent Portal →</a></p>';
  }

  function renderGuardianPending(c, guardianEmail) {
    var expiry = c.validityTime ? 'Expires ' + formatTs(c.validityTime) : 'No expiry';
    document.getElementById('quotation-body').innerHTML =
      '<div style="background:#fef9c3; border:1px solid #fde047; border-radius:12px; padding:20px 24px; display:flex; align-items:flex-start; gap:16px;">' +
        '<div style="font-size:32px; flex-shrink:0;">👨‍👩‍👦</div>' +
        '<div style="flex:1;">' +
          '<h3 style="font-size:16px; font-weight:700; color:#854d0e; margin-bottom:6px;">Awaiting Guardian Approval</h3>' +
          '<p style="font-size:13px; color:#92400e; line-height:1.6; margin-bottom:10px;">' +
            'Your quotation consent has been submitted but requires your guardian\'s approval before it can be activated. ' +
            (guardianEmail ? 'An approval request has been sent to <strong>' + escHtml(guardianEmail) + '</strong>.' : 'An approval request has been sent to your guardian.') +
          '</p>' +
          '<div style="display:flex; gap:8px; flex-wrap:wrap;">' +
            '<div style="display:flex; align-items:center; gap:6px; font-size:12px; background:#fff; border:1px solid #fde047; border-radius:8px; padding:6px 12px; color:#854d0e;">' +
              '<span style="width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0;"></span> Consent submitted' +
            '</div>' +
            '<div style="display:flex; align-items:center; gap:6px; font-size:12px; background:#fef3c7; border:1px solid #fde047; border-radius:8px; padding:6px 12px; color:#854d0e; font-weight:600;">' +
              '<span style="width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0;"></span> Guardian approval pending' +
            '</div>' +
            '<div style="display:flex; align-items:center; gap:6px; font-size:12px; background:#fff; border:1px solid #e2e8f0; border-radius:8px; padding:6px 12px; color:#94a3b8;">' +
              '<span style="width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0;"></span> Quotation preparation' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div style="margin-top:16px;">' +
        '<div class="meta-row"><span class="meta-key">Consent ID</span><span class="meta-val">' + escHtml(c.id || 'N/A') + '</span></div>' +
        '<div class="meta-row"><span class="meta-key">Status</span><span class="meta-val normal"><span class="status-badge" style="background:#fef9c3;color:#854d0e;">AWAITING GUARDIAN</span></span></div>' +
        '<div class="meta-row"><span class="meta-key">Validity</span><span class="meta-val normal">' + escHtml(expiry) + '</span></div>' +
      '</div>' +
      '<p style="margin-top:14px; font-size:12px; color:var(--muted);">Guardian can approve via the <a href="' + escHtml(consentPortalBase + '/customer/consents?auto_login=' + encodeURIComponent(guardianEmail || '')) + '" target="_blank" style="color:var(--primary);font-weight:600;">One-Stop Consent Portal →</a></p>';
  }

  function renderInactive(c) {
    var status = (c.currentStatus || c.status || '').toUpperCase();
    var badgeCls = status === 'REVOKED' ? 'badge-revoked' : 'badge-expired';
    document.getElementById('quotation-body').innerHTML =
      '<div class="quotation-none">' +
        '<div class="quotation-none-icon">⚠️</div>' +
        '<div>' +
          '<h3>Consent ' + status.charAt(0) + status.slice(1).toLowerCase() + '</h3>' +
          '<p>Your previous quotation consent is no longer active (<span class="status-badge ' + badgeCls + '">' + status + '</span>). Submit a new quotation request to get a fresh quote.</p>' +
          '<a href="/quotation.html" class="btn-get-quote">Get a New Quote →</a>' +
        '</div>' +
      '</div>';
  }

  function renderNone() {
    document.getElementById('quotation-body').innerHTML =
      '<div class="quotation-none">' +
        '<div class="quotation-none-icon">📭</div>' +
        '<div>' +
          '<h3>No Active Quotation</h3>' +
          '<p>We couldn\'t find an active consent for insurance policy creation. Please complete the quotation form to get started.</p>' +
          '<a href="/quotation.html" class="btn-get-quote">Get Your Free Quote →</a>' +
        '</div>' +
      '</div>';
  }

  function renderError(msg) {
    document.getElementById('quotation-body').innerHTML =
      '<div class="quotation-error">⚠ ' + escHtml(msg) + '</div>';
  }

  // ── API Viewer ────────────────────────────────────────────────────────────────

  async function refreshApiLogs() {
    try {
      var r = await fetch('/api/logs');
      var logs = await r.json();
      var filtered = logs.filter(function(l) { return (l.url || '').indexOf('/api/v1/') >= 0; });
      renderApiLogs(filtered);
      document.getElementById('api-count').textContent = filtered.length;
    } catch (e) {}
  }

  async function clearApiLogs() {
    try { await fetch('/api/logs', { method: 'DELETE' }); } catch (e) {}
  }

  async function doClearApiLogs() {
    await clearApiLogs();
    renderApiLogs([]);
    document.getElementById('api-count').textContent = '0';
  }

  function renderApiLogs(logs) {
    var body = document.getElementById('api-drawer-body');
    if (!logs || logs.length === 0) {
      body.innerHTML = '<div class="api-drawer-empty">No API calls for this action yet.</div>';
      return;
    }
    body.innerHTML = logs.map(function(log) {
      var m = (log.method || 'GET').toUpperCase();
      var mClass = { GET: 'm-get', POST: 'm-post', PUT: 'm-put', DELETE: 'm-delete' }[m] || 'm-get';
      var sOk = log.status >= 200 && log.status < 300;
      var shortUrl = (log.url || '').replace(/https?:\/\/[^/]+/, '');

      var filterHtml = '';
      if (m === 'GET' && (log.url || '').indexOf('/consents') >= 0) {
        var params = parseUrlParams(log.url || '');
        var rows = '';
        if (params.userIds)     rows += '<div class="filter-row"><span class="filter-key">userId</span><span class="filter-val">' + escHtml(params.userIds) + '</span></div>';
        if (params.purposeName) rows += '<div class="filter-row"><span class="filter-key">purposeName</span><span class="filter-val">' + escHtml(params.purposeName) + '</span></div>';
        if (rows) filterHtml = '<div class="api-block-label">Search Filters</div><div class="api-search-filters">' + rows + '</div>';
      }

      var bodyHtml = filterHtml +
        (log.reqBody ? '<div class="api-block-label">Request Body</div><div class="api-code">' + syntaxHighlight(log.reqBody) + '</div>' : '') +
        '<div class="api-block-label">Response (' + log.status + ')</div><div class="api-code">' + syntaxHighlight(log.resBody) + '</div>';

      return '<div class="api-entry">' +
        '<div class="api-entry-head" onclick="toggleApiEntry(this)" style="cursor:pointer;">' +
        '<span class="api-method ' + mClass + '">' + m + '</span>' +
        '<span class="api-url" title="' + escHtml(log.url || '') + '">' + escHtml(shortUrl) + '</span>' +
        '<span class="api-status ' + (sOk ? 's-ok' : 's-err') + '">' + log.status + '</span>' +
        '<span class="api-chevron">▶</span>' +
        '</div>' +
        '<div class="api-entry-body" style="display:none;">' + bodyHtml + '</div>' +
        '</div>';
    }).join('');
  }

  function toggleApiEntry(head) {
    var body = head.nextElementSibling;
    var chevron = head.querySelector('.api-chevron');
    var open = body.style.display !== 'none';
    body.style.display = open ? 'none' : 'block';
    if (chevron) chevron.textContent = open ? '▶' : '▼';
  }

  function parseUrlParams(url) {
    var params = {};
    var idx = url.indexOf('?');
    if (idx < 0) return params;
    url.slice(idx + 1).split('&').forEach(function(part) {
      var eq = part.indexOf('=');
      if (eq >= 0) params[decodeURIComponent(part.slice(0, eq))] = decodeURIComponent(part.slice(eq + 1));
    });
    return params;
  }

  function formatTs(ts) {
    if (!ts) return '';
    var ms = ts > 1e12 ? ts : ts * 1000;
    return new Date(ms).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function syntaxHighlight(obj) {
    if (obj === null || obj === undefined) return '<span class="json-null">null</span>';
    var json = JSON.stringify(obj, null, 2).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function(match) {
      if (/^"/.test(match)) return '<span class="' + (/:$/.test(match) ? 'json-key' : 'json-str') + '">' + match + '</span>';
      if (/true|false/.test(match)) return '<span class="json-bool">' + match + '</span>';
      if (/null/.test(match))       return '<span class="json-null">' + match + '</span>';
      return '<span class="json-num">' + match + '</span>';
    });
  }

  init();

  // ── Split Resize ─────────────────────────────────────────────────────────────
  (function() {
    var handle = document.getElementById('split-handle');
    var pane   = document.getElementById('main-pane');
    var cont   = pane.parentElement;
    var drag   = false, startX = 0, startW = 0;
    handle.addEventListener('mousedown', function(e) {
      drag = true; startX = e.clientX;
      startW = pane.getBoundingClientRect().width;
      handle.classList.add('dragging');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      e.preventDefault();
    });
    document.addEventListener('mousemove', function(e) {
      if (!drag) return;
      var cw = cont.getBoundingClientRect().width;
      var nw = Math.max(320, Math.min(cw - 260 - 5, startW + (e.clientX - startX)));
      pane.style.width = nw + 'px';
    });
    document.addEventListener('mouseup', function() {
      if (!drag) return;
      drag = false;
      handle.classList.remove('dragging');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    });
  })();
</script>
</body>
</html>
